    <script>
      // Safeguard against polyfills attempting to overwrite window.fetch in environments where it is getter-only
      (function() {
        try {
          var originalFetch = window.fetch;
          var storedFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return storedFetch; },
            set: function(fn) { storedFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
